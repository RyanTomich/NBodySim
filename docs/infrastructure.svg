</g>
<g id="results"><rect x="630" y="920" width="440" height="105" rx="8" fill="#ecfdf5" stroke="#6aa88b" stroke-width="1.5"/>
<text x="850.0" y="949" class="name" text-anchor="middle">results/</text>
<text x="850.0" y="977" class="role" text-anchor="middle">persistent experiment records</text>
<text x="850.0" y="1005" class="detail" text-anchor="middle">Binary, inputs, samples, summaries and logs</text>
</g>
<g id="plots"><rect x="630" y="1080" width="440" height="105" rx="8" fill="#ecfdf5" stroke="#6aa88b" stroke-width="1.5"/>
<text x="850.0" y="1109" class="name" text-anchor="middle">plot_results.py → plots/</text>
<text x="850.0" y="1137" class="role" text-anchor="middle">runtime and speedup figures</text>
<text x="850.0" y="1165" class="detail" text-anchor="middle">Saved timings normalized by step count</text>
