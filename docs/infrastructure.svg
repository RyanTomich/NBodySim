</g>
<g id="runner"><rect x="630" y="600" width="440" height="105" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="850.0" y="629" class="name" text-anchor="middle">bench/run.py</text>
<text x="850.0" y="657" class="role" text-anchor="middle">rebuild, archive and coordinate</text>
<text x="850.0" y="685" class="detail" text-anchor="middle">Saved inputs; optional n2 comparison</text>
</g>
<g id="driver"><rect x="630" y="760" width="440" height="105" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="850.0" y="789" class="name" text-anchor="middle">bench/driver.c</text>
<text x="850.0" y="817" class="role" text-anchor="middle">reset, warm up and time simulation</text>
