<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
<title id="title">N-body simulator module flowchart</title>
<desc id="desc">Main orchestrates a CLI simulation with state I/O and numeric parsing, owned simulation state, backend lifecycle management and kick-drift-kick leapfrog integration. solver.c selects and prepares a backend; leapfrog.c recomputes initial acceleration for each nonempty positive-step call, then invokes the force callback once per step after drifting. Forces depend only on current masses and positions; post-drift velocities are half-step values. Acceleration is published after the whole callback. Returned velocities are full-step values and accelerations match final positions. Empty or zero-step calls leave state untouched. Barnes–Hut owns monopole aggregation and traversal with validated topology reuse; FMM owns multipole construction, tree interactions and local evaluation. Both tree solvers use direct particle interactions and a bounded spatial hierarchy. Only FMM uses an all-pairs fallback. laplace.c prepares Cartesian expansion tables and translates multipoles to local expansions, using generated unrolled arithmetic at order four. Secondary parsing, lifecycle and state-view calls are omitted.</desc>
