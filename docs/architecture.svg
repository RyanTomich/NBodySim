<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" role="img" aria-labelledby="title desc">
<title id="title">N-body simulator module flowchart</title>
<desc id="desc">Main orchestrates CLI input, state ownership, backend setup, and integrator selection. Kick-drift-kick leapfrog is the default and refreshes the initial acceleration. Forward Euler uses the supplied acceleration for its first velocity update. Both use one position-dependent force callback per step. The registered solvers are direct n2, serial Barnes–Hut, particle-parallel Barnes–Hut, grouped Barnes–Hut, and FMM. The serial and grouped Barnes–Hut backends share a bounded bucket octree with FMM; the particle-parallel backend uses its own single-particle-leaf tree. Tree solvers report force evaluation failures to the integrator. Private FMM expansion translations use generated arithmetic at order four.</desc>
